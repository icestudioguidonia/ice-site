        .page-transition { animation: fadeIn 0.5s ease-out; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }

                        <div class="glass-card aspect-square rounded-[2rem] flex flex-col items-center justify-center p-6 grayscale hover:grayscale-0 transition-all cursor-pointer">
                             <div class="w-20 h-20 mb-4 bg-slate-800 rounded-full flex items-center justify-center border border-cyan-500/20">
                                <i data-lucide="user" class="text-cyan-400"></i>
                             </div>
                             <span class="text-[10px] font-black uppercase tracking-widest">Artist Name</span>
                        </div>
                        <div class="glass-card aspect-square rounded-[2rem] flex flex-col items-center justify-center p-6 grayscale hover:grayscale-0 transition-all cursor-pointer">
                             <div class="w-20 h-20 mb-4 bg-slate-800 rounded-full flex items-center justify-center border border-cyan-500/20">
                                <i data-lucide="user" class="text-cyan-400"></i>
                             </div>
                             <span class="text-[10px] font-black uppercase tracking-widest">Artist Name</span>
                        </div>
                    </div>
                    <p class="text-center mt-12 text-slate-500 text-[10px] font-bold uppercase tracking-widest italic">Entra anche tu nella famiglia Ice Studio.</p>
                </div>
            `,
            contatti: `
                <div class="page-transition max-w-4xl mx-auto py-12 px-6 pb-32">
                    <div class="glass-card rounded-[3rem] p-10 shadow-2xl">
                        <h3 class="text-xs font-black uppercase tracking-widest text-cyan-500 mb-8 text-center">Inviaci un messaggio</h3>
                        <div class="space-y-6">
                            <input type="text" placeholder="IL TUO NOME D'ARTE" class="w-full bg-slate-950 border border-slate-800 p-4 rounded-xl focus:border-cyan-500 outline-none text-xs font-bold uppercase tracking-tight">
                            <textarea placeholder="PROGETTO O RICHIESTA..." class="w-full bg-slate-950 border border-slate-800 p-4 rounded-xl h-32 focus:border-cyan-500 outline-none text-xs font-bold uppercase tracking-tight"></textarea>
                            <button class="w-full py-5 bg-cyan-500 text-slate-950 rounded-2xl font-black uppercase text-[10px] tracking-widest">Invia richiesta</button>
                        </div>
                    </div>
                </div>
            `
        };

        function navigateTo(pageId) {
            const container = document.getElementById('content-area');
            container.innerHTML = pages[pageId];
            window.scrollTo({top: 0, behavior: 'smooth'});
            lucide.createIcons();
            
            document.querySelectorAll('.nav-link').forEach(link => {
                if(link.innerText.toLowerCase() === pageId) {
                    link.classList.add('text-cyan-400');
                } else {
                    link.classList.remove('text-cyan-400');
                }
            });
        }

        function addToCart(name, price) {
            cart.push({name, price});
            updateCartUI();
        }

        function updateCartUI() {
            total = cart.reduce((sum, item) => sum + item.price, 0);
            const cartBar = document.getElementById('cart-bar');
            if(cart.length > 0) {
                cartBar.classList.remove('hidden');
                document.getElementById('total-display').innerText = total + '€';
            } else {
                cartBar.classList.add('hidden');
            }
        }

        function emptyCart() {
            cart = [];
            updateCartUI();
        }

        // Funzione per il Checkout via PayPal
        function checkout() {
            if(cart.length === 0) return;
            
            // Reindirizza al link PayPal configurato
            // Puoi anche aggiungere l'importo totale al link se supportato dal tipo di profilo PayPal (es. paypal.me/utente/10)
            window.open(`${paypalLink}/${total}`, '_blank');
        }

        window.onload = () => navigateTo('home');
    </script>

    <div id="cart-bar" class="hidden fixed bottom-0 inset-x-0 bg-slate-950/95 backdrop-blur-2xl border-t border-cyan-500/20 py-8 px-8 z-[110]">
        <div class="max-w-6xl mx-auto flex items-center justify-between">
            <div>
                <span class="text-[9px] text-cyan-600 font-black uppercase tracking-[0.3em] mb-1 block">Carrello</span>
                <span id="total-display" class="text-4xl font-black tracking-tighter italic">0€</span>
            </div>
            <div class="flex gap-4">
                <button onclick="emptyCart()" class="p-4 bg-slate-900 text-slate-500 rounded-xl hover:text-red-500 border border-slate-800"><i data-lucide="trash-2"></i></button>
                <button onclick="checkout()" class="px-10 py-4 bg-white text-slate-950 rounded-xl font-black text-[10px] uppercase tracking-widest hover:bg-cyan-400 transition-all">Acquista</button>
            </div>
        </div>
    </div>
</body>
</html>
